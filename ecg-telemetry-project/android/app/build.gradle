plugins { id 'com.android.application' }

android {
    namespace 'com.example.ecg'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.ecg"
        // 24, not 21: MainActivity uses Map.merge(), which is API 24+.
        // RFCOMM itself works far further back if you inline that call.
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // org.json is part of the Android platform - no dependency needed
}
